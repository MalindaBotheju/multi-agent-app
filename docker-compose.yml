# Lets you run `docker compose up --build` instead of separate
# `docker build` + `docker run` commands. Same image, same Dockerfile —
# this is just a convenience wrapper around it.

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env   # must exist locally — copy .env.example to .env first
